name: Rank CFB Teams

on:
  workflow_dispatch:
    inputs:

jobs:
  rank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Store ratingsystems auth key
        run: |
          printf "${{ secrets.API_AUTH_KEY }}" >>  ~/.ratingsystems/auth/cfb

      - name: Fetch data
        run: |
          ratingsystems fetch -d cfb -y 2026

      - name: Rank teams (pretty)
        run: |
          ratingsystems rate -d cfb -y 2026 -r cer -r rrs --ranks --pretty

      - name: Rank teams (csv)
        run: |
          ratingsystems rate -d cfb -y 2026 -r cer -r rrs --ranks
